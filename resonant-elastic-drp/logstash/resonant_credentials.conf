# resonant_credentials.conf - Tempest Resonant DRP: credenciais vazadas -> Elastic data stream.
# Le o NDJSON do coletor (paginacao dinamica) e envia ao Elastic.
# @timestamp = hora da coleta. Segredos ja vieram redigidos do coletor (Logstash nunca ve senha).
# Idempotente: document_id = event.hash (op create -> dedup).
#
# Ajuste os placeholders <...> antes de subir.

input {
  file {
    path           => "<BASE_DIR>/spool/resonant_cred_*.ndjson"
    mode           => "read"
    start_position => "beginning"
    codec          => json
    sincedb_path   => "<BASE_DIR>/sincedb_resonant_cred"
    file_completed_action   => "log"
    file_completed_log_path => "<LOG_DIR>/resonant_cred_completed.log"
    tags           => ["resonant", "credentials-exposure"]
  }
}

filter {
  ruby {
    code => '
      now = Time.now.utc
      event.set("@timestamp", LogStash::Timestamp.new(now))
      event.set("[event][ingested]", now.strftime("%Y-%m-%dT%H:%M:%S.%LZ"))
    '
  }
  mutate {
    add_field    => { "[ecs][version]" => "8.11.0" }
    remove_field => ["host", "log", "message", "path", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts   => ["https://<ELASTIC_HOST>:443"]
    api_key => "${api_key}"               # keystore: logstash-keystore add api_key  (formato id:api_key)
    data_stream           => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "resonant_credentials_exposure"
    data_stream_namespace => "resonant"
    document_id => "%{[event][hash]}"
    ssl_enabled => true
  }
}
